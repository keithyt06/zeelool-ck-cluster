schemaVersion: "2.2"
description: "Render ClickHouse config.d/*.xml, users.d/*.xml and restart clickhouse-server"
parameters:
  RemoteServersXml:
    type: String
    description: "base64 of remote-servers.xml"
  ZookeeperXml:
    type: String
    description: "base64 of zookeeper.xml (points to Keeper ensemble)"
  MacrosXml:
    type: String
    description: "base64 of macros.xml (shard/replica identity)"
  UsersXml:
    type: String
    description: "base64 of users.d/default-user.xml"
  InterserverXml:
    type: String
    description: "base64 of interserver.xml (per-node interserver_http_host = this node's private IP)"
  ListenXml:
    type: String
    description: "base64 of listen.xml (listen_host + listen_try). Shared across all nodes."
  AccessControlXml:
    type: String
    description: "base64 of access-control.xml (user_directories.replicated — SQL-managed users replicate via Keeper)."
mainSteps:
  - name: writeConfigs
    action: aws:runShellScript
    inputs:
      runCommand:
        - "set -euxo pipefail"
        - "mkdir -p /etc/clickhouse-server/config.d /etc/clickhouse-server/users.d"
        - "echo '{{ RemoteServersXml }}' | base64 -d > /etc/clickhouse-server/config.d/remote-servers.xml"
        - "echo '{{ ZookeeperXml }}' | base64 -d > /etc/clickhouse-server/config.d/zookeeper.xml"
        - "echo '{{ MacrosXml }}' | base64 -d > /etc/clickhouse-server/config.d/macros.xml"
        - "echo '{{ InterserverXml }}' | base64 -d > /etc/clickhouse-server/config.d/interserver.xml"
        - "echo '{{ ListenXml }}' | base64 -d > /etc/clickhouse-server/config.d/listen.xml"
        - "echo '{{ AccessControlXml }}' | base64 -d > /etc/clickhouse-server/config.d/access-control.xml"
        - "echo '{{ UsersXml }}' | base64 -d > /etc/clickhouse-server/users.d/default-user.xml"
        - "chown -R clickhouse:clickhouse /etc/clickhouse-server"
        - "systemctl restart clickhouse-server"
        - "sleep 5"
        - "systemctl is-active clickhouse-server"
        # Verify HTTP endpoint up. Use /ping (no auth) rather than
        # `clickhouse-client --query 'SELECT 1'` — after users.d enables a password,
        # the unauthenticated client would fail AUTHENTICATION_FAILED even though
        # CK is healthy. Auth-aware smoke testing happens out-of-band in smoke.sh.
        - "for i in $(seq 1 10); do curl -fsS http://127.0.0.1:8123/ping > /dev/null && exit 0; sleep 2; done; echo 'CK /ping never responded' >&2; exit 1"
